<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vote Cast Successfully!</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles.css?v=57">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        .success-icon {
            font-size: 5rem;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 10px rgba(16,185,129,0.3));
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <!-- Canvas for confetti -->
    <canvas id="confetti-canvas"></canvas>

    <div class="container text-center">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card glass-card p-5">
                    <div class="mb-4">
                        <i class="bi bi-check-circle-fill success-icon"></i>
                    </div>
                    <h2 class="fw-bold mb-2">Vote Cast Successfully!</h2>
                    <p class="text-secondary mb-4">Your vote has been cryptographically recorded on the serverless electronic ledger. Thank you for voting.</p>
                    <div class="spinner-border text-primary spinner-border-sm mb-3"></div>
                    <p class="text-muted small">Redirecting to main portal in <span id="secs">5</span> seconds...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Apply theme persistence
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-theme');
        } else {
            document.body.classList.remove('light-theme');
        }

        // Fire confetti on load
        function fireConfetti() {
            var duration = 4 * 1000;
            var end = Date.now() + duration;

            (function frame() {
                // left side
                confetti({
                    particleCount: 3,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 }
                });
                // right side
                confetti({
                    particleCount: 3,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 }
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }
        
        try {
            fireConfetti();
        } catch(e) {
            console.error("Confetti error", e);
        }

        let countdown = 5;
        setInterval(() => {
            countdown--;
            document.getElementById('secs').innerText = countdown;
            if (countdown <= 0) {
                window.location.href = 'index.html';
            }
        }, 1000);
    </script>
</body>
</html>
