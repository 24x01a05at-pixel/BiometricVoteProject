<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voter Profile Correction | Secure Biometric Voting</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { background: #0b0f19; font-family: 'Outfit', sans-serif; color: #f1f5f9; }
        .hero-title {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            background: linear-gradient(135deg, #c084fc, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .correction-card {
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(168, 85, 247, 0.25);
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(168, 85, 247, 0.1);
        }
        .webcam-box {
            position: relative;
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
            border-radius: 20px;
            overflow: hidden;
            border: 3px solid #a855f7;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.2);
            background: #000;
        }
        video { width: 100%; display: block; }
        .face-frame {
            position: absolute;
            top: 10%;
            left: 15%;
            width: 70%;
            height: 80%;
            border: 2px dashed rgba(168, 85, 247, 0.7);
            border-radius: 50%;
            pointer-events: none;
        }
        .scan-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, #a855f7, transparent);
            animation: scan 2.5s linear infinite;
            pointer-events: none;
        }
        @keyframes scan {
            0% { top: 0%; }
            50% { top: 100%; }
            100% { top: 0%; }
        }
        .form-control, .form-select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            border-radius: 12px;
        }
        .form-control:focus, .form-select:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: #a855f7;
            box-shadow: 0 0 0 0.25rem rgba(168, 85, 247, 0.25);
            color: #fff;
        }
        .btn-purple {
            background: linear-gradient(135deg, #a855f7, #6366f1);
            border: none;
            color: #fff;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-purple:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
        .navbar {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="d-flex flex-column justify-content-between min-vh-100 py-0">

    <!-- Top Navigation Bar -->
    <nav class="navbar navbar-dark py-3">
        <div class="container d-flex justify-content-between">
            <span class="navbar-brand mb-0 h1 fw-bold"><i class="bi bi-shield-check text-purple me-2"></i>Secure Biometric Voting</span>
            <a href="index.html" class="btn btn-outline-light btn-sm"><i class="bi bi-house me-1"></i>Home Portal</a>
        </div>
    </nav>

    <div class="container py-5 text-center my-auto">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="card correction-card p-4 p-md-5">
                    <h2 class="fw-bold mb-2 hero-title"><i class="bi bi-pencil-square me-2"></i>Voter Profile Correction</h2>
                    <p class="text-secondary mb-4">First, align your face in the oval container to biometrically verify your registered voter profile.</p>

                    <div id="alert-box" class="alert d-none mb-4 text-start" role="alert"></div>

                    <!-- Step 1: Biometric Verification -->
                    <div id="verification-section">
                        <div class="webcam-box mb-4">
                            <video id="webcam" autoplay playsinline muted></video>
                            <div class="face-frame"></div>
                            <div class="scan-bar"></div>
                            <button type="button" id="btn-switch-camera" class="btn btn-dark btn-sm position-absolute d-none" style="top: 10px; right: 10px; z-index: 10; opacity: 0.85; border: 1px solid rgba(255,255,255,0.25);">
                                <i class="bi bi-camera-video-fill me-1"></i>Switch Camera
                            </button>
                        </div>
                        <canvas id="canvas" class="d-none" width="640" height="480"></canvas>

                        <button id="btn-scan" class="btn btn-purple btn-lg px-5 py-3 fw-bold w-100 fs-5">
                            <i class="bi bi-person-check-fill me-2"></i>VERIFY IDENTITY & EDIT PROFILE
                        </button>
                    </div>

                    <!-- Step 2: Edit Form (Initially Hidden) -->
                    <div id="edit-section" class="d-none text-start">
                        <div class="alert alert-success border-0 py-3 mb-4 d-flex align-items-center">
                            <i class="bi bi-patch-check-fill fs-3 me-3 text-success"></i>
                            <div>
                                <h6 class="fw-bold mb-0">Biometrics Verified Successfully</h6>
                                <p class="small mb-0 text-white-50">Voter profile found: <span id="verified-name-badge" class="fw-semibold text-white"></span></p>
                            </div>
                        </div>

                        <form id="correction-form">
                            <div class="mb-4">
                                <label class="form-label small fw-bold text-white-50">Proposed Full Name</label>
                                <input type="text" id="new_name" class="form-control form-control-lg bg-dark text-white border-secondary" placeholder="Enter corrected full name" required>
                            </div>

                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold text-white-50">Proposed Age</label>
                                    <input type="number" id="new_age" class="form-control form-control-lg bg-dark text-white border-secondary" placeholder="Enter corrected age" min="18" max="120" required>
                                </div>
                                <div class="col-md-6 mt-3 mt-md-0">
                                    <label class="form-label small fw-bold text-white-50">Proposed Gender</label>
                                    <select id="new_gender" class="form-select form-select-lg bg-dark text-white border-secondary" required>
                                        <option value="" disabled>-- Select Gender --</option>
                                        <option value="Male">Male</option>
                                        <option value="Female">Female</option>
                                        <option value="Other">Other</option>
                                    </select>
                                </div>
                            </div>

                            <button type="submit" id="btn-submit" class="btn btn-purple btn-lg px-5 py-3 fw-bold w-100 fs-5">
                                <i class="bi bi-check-circle-fill me-2"></i>SUBMIT CORRECTION REQUEST
                            </button>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Righteous Quote Footer -->
    <footer class="py-4 text-center mt-5" style="border-top: 1px solid rgba(255,255,255,0.05); background: rgba(15,23,42,0.45);">
        <p class="mb-0 text-white-50 fst-italic" style="font-size: 0.9rem;">"Elections belong to the people. It's their decision." — Abraham Lincoln</p>
    </footer>

    <script src="db.js?v=32"></script>
    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const alertBox = document.getElementById('alert-box');
        const btnScan = document.getElementById('btn-scan');
        const verificationSection = document.getElementById('verification-section');
        const editSection = document.getElementById('edit-section');
        const verifiedNameBadge = document.getElementById('verified-name-badge');
        const correctionForm = document.getElementById('correction-form');
        
        let voters = [];
        let verifiedVoter = null;

        async function init() {
            showSpinner("Connecting to database...");
            voters = await getDB('voters', []);
            hideSpinner();
            if (voters.length === 0) {
                showAlert('warning', "No voters currently registered in the database.");
                btnScan.disabled = true;
            }
        }
        init();

        // Switchable Camera Stream API
        let currentStream = null;
        let videoDevices = [];
        let currentDeviceIndex = 0;

        async function startWebcam(deviceId = null) {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            const constraints = {
                video: { width: 640, height: 480 }
            };
            if (deviceId) {
                constraints.video.deviceId = { exact: deviceId };
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                currentStream = stream;
                video.srcObject = stream;
                await video.play();
                await enumerateCameras();
            } catch (err) {
                console.error("Camera access failed:", err);
                showAlert('danger', "Camera access failed. Please ensure your camera is not in use and that you have granted browser permissions.");
            }
        }

        async function enumerateCameras() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                videoDevices = devices.filter(device => device.kind === 'videoinput');
                const switchBtn = document.getElementById('btn-switch-camera');
                if (videoDevices.length > 1) {
                    switchBtn.classList.remove('d-none');
                } else {
                    switchBtn.classList.add('d-none');
                }
            } catch (e) {
                console.warn("Could not enumerate cameras:", e);
            }
        }

        document.getElementById('btn-switch-camera').addEventListener('click', async () => {
            if (videoDevices.length < 2) return;
            currentDeviceIndex = (currentDeviceIndex + 1) % videoDevices.length;
            await startWebcam(videoDevices[currentDeviceIndex].deviceId);
        });

        startWebcam();

        // Biometric Face Liveness check helper
        function checkLiveness(canvasEl) {
            const ctx = canvasEl.getContext('2d');
            const frame = ctx.getImageData(0, 0, canvasEl.width, canvasEl.height);
            const data = frame.data;
            
            let redSum = 0, blueSum = 0, count = 0;
            let totalBr = 0;
            let squareDiff = 0;
            
            const step = 4;
            for (let i = 0; i < data.length; i += 4 * step) {
                let r = data[i];
                let g = data[i+1];
                let b = data[i+2];
                
                redSum += r;
                blueSum += b;
                let brightness = (r + g + b) / 3;
                totalBr += brightness;
                count++;
            }
            
            const avgBr = totalBr / count;
            for (let i = 0; i < data.length; i += 4 * step) {
                let r = data[i];
                let g = data[i+1];
                let b = data[i+2];
                let brightness = (r + g + b) / 3;
                squareDiff += (brightness - avgBr) * (brightness - avgBr);
            }
            
            const variance = Math.sqrt(squareDiff / count);
            const rbRatio = redSum / (blueSum || 1);
            
            let faceBrightness = 0;
            let borderBrightness = 0;
            let faceCount = 0;
            let borderCount = 0;
            
            const w = canvasEl.width;
            const h = canvasEl.height;
            for (let y = 0; y < h; y += 10) {
                for (let x = 0; x < w; x += 10) {
                    const dx = (x - w/2) / (w * 0.35);
                    const dy = (y - h/2) / (h * 0.40);
                    const inside = (dx*dx + dy*dy) <= 1.0;
                    
                    const idx = (y * w + x) * 4;
                    const br = (data[idx] + data[idx+1] + data[idx+2]) / 3;
                    
                    if (inside) {
                        faceBrightness += br;
                        faceCount++;
                    } else {
                        borderBrightness += br;
                        borderCount++;
                    }
                }
            }
            
            const faceContrast = Math.abs((faceBrightness / (faceCount || 1)) - (borderBrightness / (borderCount || 1)));
            
            let clippedPixels = 0;
            for (let i = 0; i < data.length; i += 4 * step) {
                if (data[i] > 250 && data[i+1] > 250 && data[i+2] > 250) {
                    clippedPixels++;
                }
            }
            const clippedRatio = clippedPixels / count;
            
            const success = (rbRatio >= 1.10) && (variance >= 6.0) && (variance <= 150.0) && (faceContrast >= 29.0) && (clippedRatio <= 0.08);
            
            return {
                success,
                variance,
                rbRatio,
                faceContrast,
                clippedRatio
            };
        }

        // 12x12 Signature extraction
        function getFaceSignature(canvasEl) {
            const ctx = canvasEl.getContext('2d');
            const w = canvasEl.width;
            const h = canvasEl.height;
            
            const blocksX = 12;
            const blocksY = 12;
            const sig = [];
            
            const rectWidth = Math.floor((w * 0.7) / blocksX);
            const rectHeight = Math.floor((h * 0.8) / blocksY);
            const startX = Math.floor(w * 0.15);
            const startY = Math.floor(h * 0.1);
            
            for (let y = 0; y < blocksY; y++) {
                for (let x = 0; x < blocksX; x++) {
                    const bx = startX + x * rectWidth;
                    const by = startY + y * rectHeight;
                    const imgData = ctx.getImageData(bx, by, rectWidth, rectHeight);
                    const d = imgData.data;
                    
                    let sum = 0;
                    for (let i = 0; i < d.length; i += 4) {
                        sum += (d[i] + d[i+1] + d[i+2]) / 3;
                    }
                    sig.push(Math.round(sum / (d.length / 4)));
                }
            }
            
            // Local Contrast Stretching normalization
            const minVal = Math.min(...sig);
            const maxVal = Math.max(...sig);
            const range = (maxVal - minVal) || 1;
            return sig.map(v => Math.round(((v - minVal) / range) * 255));
        }

        function calculateDistance(sig1, sig2) {
            if (!sig1 || !sig2) return 999;
            if (sig1.length !== sig2.length) return 999;
            let sum = 0;
            for (let i = 0; i < sig1.length; i++) {
                let diff = sig1[i] - sig2[i];
                sum += diff * diff;
            }
            return Math.sqrt(sum / sig1.length);
        }

        function calculateShiftedDistance(sig1, sig2) {
            if (!sig1 || !sig2) return 999;
            if (sig1.length === 36 || sig2.length === 36) {
                return calculateDistance(sig1, sig2);
            }
            
            let minDistance = 999;
            for (let dy = -1; dy <= 1; dy++) {
                for (let dx = -1; dx <= 1; dx++) {
                    let sum = 0;
                    let count = 0;
                    for (let y = 0; y < 12; y++) {
                        for (let x = 0; x < 12; x++) {
                            let tx = x + dx;
                            let ty = y + dy;
                            if (tx >= 0 && tx < 12 && ty >= 0 && ty < 12) {
                                let v1 = sig1[ty * 12 + tx];
                                let v2 = sig2[y * 12 + x];
                                let diff = v1 - v2;
                                sum += diff * diff;
                                count++;
                            }
                        }
                    }
                    if (count > 0) {
                        const dist = Math.sqrt(sum / count);
                        if (dist < minDistance) minDistance = dist;
                    }
                }
            }
            return minDistance;
        }

        function showAlert(type, message) {
            alertBox.className = `alert alert-${type} mb-4`;
            alertBox.innerText = message;
            alertBox.classList.remove('d-none');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetScanButton() {
            btnScan.disabled = false;
            btnScan.innerHTML = '<i class="bi bi-person-check-fill me-2"></i>VERIFY IDENTITY & EDIT PROFILE';
        }

        // Scan click handler
        btnScan.addEventListener('click', async () => {
            btnScan.disabled = true;
            btnScan.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Verifying Facial Biometrics...';
            alertBox.classList.add('d-none');

            // Draw to canvas
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Check liveness
            const liveness = checkLiveness(canvas);
            if (!liveness.success) {
                showAlert('danger', "Biometric Spoof Detected: Please verify in front of a real, well-lit webcam. Digital screen photos or printouts are blocked.");
                resetScanButton();
                return;
            }

            const liveSignature = getFaceSignature(canvas);

            // Re-fetch voters
            const freshVoters = await getDB('voters', []);
            
            // Match against ALL registered voters using shifted-matching
            let matchedVoter = null;
            let minDistance = 999;
            
            freshVoters.forEach(v => {
                if (v.face_signature) {
                    const dist = calculateShiftedDistance(liveSignature, v.face_signature);
                    if (dist < minDistance && dist < 53.0) {
                        minDistance = dist;
                        matchedVoter = v;
                    }
                }
            });

            setTimeout(() => {
                if (!matchedVoter) {
                    showAlert('danger', "Biometric Match Failed: Face signature does not match any registered voter.");
                    resetScanButton();
                    return;
                }

                // If voter has already voted, block correction to prevent election manipulation
                if (matchedVoter.has_voted) {
                    showAlert('danger', "Correction Denied: This voter profile has already cast a vote. Profile changes are locked after voting.");
                    resetScanButton();
                    return;
                }

                // Match found! Unlock Edit section
                verifiedVoter = matchedVoter;
                
                // Stop camera stream to free hardware resources
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                }

                verificationSection.classList.add('d-none');
                verifiedNameBadge.innerText = `${verifiedVoter.full_name} (Age: ${verifiedVoter.age || 'N/A'}, Gender: ${verifiedVoter.gender || 'N/A'})`;
                
                // Prefill form
                document.getElementById('new_name').value = verifiedVoter.full_name;
                document.getElementById('new_age').value = verifiedVoter.age || '';
                document.getElementById('new_gender').value = verifiedVoter.gender || '';
                
                editSection.classList.remove('d-none');
            }, 2000);
        });

        // Form submission
        correctionForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btnSubmit = document.getElementById('btn-submit');
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Submitting Request...';

            const newName = document.getElementById('new_name').value.trim();
            const newAge = parseInt(document.getElementById('new_age').value);
            const newGender = document.getElementById('new_gender').value;

            if (newAge < 18) {
                showAlert('danger', "Proposed Correction Denied: Voter must be 18 years or older.");
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = '<i class="bi bi-check-circle-fill me-2"></i>SUBMIT CORRECTION REQUEST';
                return;
            }

            try {
                const requests = await getDB('correction_requests', []);
                
                // Add request
                requests.push({
                    id: Date.now(),
                    voter_id: verifiedVoter.id,
                    old_name: verifiedVoter.full_name,
                    old_age: verifiedVoter.age || "",
                    old_gender: verifiedVoter.gender || "",
                    new_name: newName,
                    new_age: newAge,
                    new_gender: newGender,
                    status: 'PENDING',
                    requested_at: new Date().toLocaleString()
                });

                await setDB('correction_requests', requests);
                
                showAlert('success', "Correction request submitted successfully! It will take effect once approved by the Election Administrator.");
                editSection.innerHTML = `
                    <div class="alert alert-success border-0 py-3 mb-4 d-flex align-items-center">
                        <i class="bi bi-clock-history fs-3 me-3 text-success"></i>
                        <div>
                            <h6 class="fw-bold mb-0">Pending Admin Approval</h6>
                            <p class="small mb-0 text-white-50">Your profile change request has been recorded. Once the administrator approves it, your credentials will update automatically.</p>
                        </div>
                    </div>
                    <a href="index.html" class="btn btn-outline-light w-100 py-3 fw-bold"><i class="bi bi-house me-2"></i>Return to Portal</a>
                `;
            } catch (err) {
                console.error(err);
                showAlert('danger', "Failed to submit correction request to ledger. Please try again.");
                btnSubmit.disabled = false;
            }
        });
    </script>
</body>
</html>
