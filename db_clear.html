<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biometric Vote - Cache & Database Reset Utility</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles.css?v=54">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">
    <div class="container text-center py-5">
        <div class="card glass-card p-5 mx-auto" style="max-width: 500px;">
            <div class="text-danger mb-4">
                <i class="bi bi-trash3 display-1"></i>
            </div>
            <h2 class="fw-bold mb-3">Database Reset Utility</h2>
            <p class="text-secondary mb-4">This utility will completely clear your browser's local cache and local storage keys for the Biometric Vote Project to give you a clean slate.</p>
            
            <button onclick="clearLocalStorage()" class="btn btn-danger btn-lg fw-bold w-100 mb-3 py-3">
                <i class="bi bi-shield-slash-fill me-2"></i>WIPE LOCAL CACHE
            </button>
            <a href="index.html" class="btn btn-premium-outline w-100 py-2">
                <i class="bi bi-house-door-fill me-2"></i>Go to Home Portal
            </a>
            
            <div id="status" class="mt-4 alert alert-success d-none" role="alert">
                Local storage wiped successfully! Please refresh all other open tabs.
            </div>
        </div>
    </div>

    <script>
        function clearLocalStorage() {
            localStorage.clear();
            sessionStorage.clear();
            document.getElementById('status').classList.remove('d-none');
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 2000);
        }
    </script>
</body>
</html>
